name: Deploy

# Deploys the Analytics Agent to ECS Fargate (dev).
#
# What "deploy" means here:
#   1. Build the Docker image and push it to ECR with a sha-{git_sha} tag
#      and update the :latest tag.
#   2. Register a new ECS task definition revision with the new image.
#   3. Update the ECS service to roll out the new revision.
#      Wait for service stability (new task healthy, old task stopped).
#
# AWS authentication uses OIDC (OpenID Connect), no long-lived access keys
# are stored in GitHub secrets. The OIDC provider and IAM role are created
# once in terraform-bootstrap and are never torn down with the rest of the
# platform infrastructure.
#
# Prerequisites (must be done once before the first deploy):
#   1. Run terraform apply in terraform-bootstrap — creates the OIDC provider
#      and edp-{env}-github-actions-role for all environments.
#   2. Run terraform apply in terraform-platform-infra-live — creates the ECS
#      cluster, ECR repository, ALB, and ECS service for the analytics agent.
#   3. Run terraform apply in terraform-github-setup — creates the dev/staging/prod
#      GitHub Environments and sets the AWS_ACCOUNT_ID repository variable.
#
# Required GitHub configuration:
#   Repository variable (Settings -> Secrets and variables -> Actions -> Variables):
#     AWS_ACCOUNT_ID: 12-digit AWS account ID (not a secret, appears in S3 names)
#   Environments: dev, staging, prod (created by terraform-github-setup)
#
# Triggers:
#   - workflow_dispatch -> manually deploys to the selected environment
#
# Promotion path: dev (manual) -> staging (manual) -> prod (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, staging, prod]

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    permissions:
      # id-token: write is required for OIDC authentication to AWS.
      id-token: write
      contents: read

    env:
      ENV:                 ${{ inputs.environment || 'dev' }}
      AWS_REGION:          eu-central-1
      CONTAINER_NAME:      agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mask AWS account ID in logs
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"

      - name: Configure AWS credentials (OIDC)
        env:
          ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          AWS_REGION_VALUE:     ${{ env.AWS_REGION }}
        run: |
          echo "::add-mask::${ROLE_ARN}"
          OIDC_TOKEN_JSON=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC_TOKEN=$(printf '%s' "${OIDC_TOKEN_JSON}" | jq -r '.value')
          CREDS=$(aws sts assume-role-with-web-identity \
            --role-arn "${ROLE_ARN}" \
            --role-session-name "github-actions" \
            --web-identity-token "${OIDC_TOKEN}" \
            --duration-seconds 3600 \
            --query Credentials \
            --output json)
          AWS_ACCESS_KEY_ID=$(printf '%s' "${CREDS}" | jq -r '.AccessKeyId')
          AWS_SECRET_ACCESS_KEY=$(printf '%s' "${CREDS}" | jq -r '.SecretAccessKey')
          AWS_SESSION_TOKEN=$(printf '%s' "${CREDS}" | jq -r '.SessionToken')
          echo "::add-mask::${AWS_ACCESS_KEY_ID}"
          echo "::add-mask::${AWS_SECRET_ACCESS_KEY}"
          echo "::add-mask::${AWS_SESSION_TOKEN}"
          {
            echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
            echo "AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}"
            echo "AWS_REGION=${AWS_REGION_VALUE}"
            echo "AWS_DEFAULT_REGION=${AWS_REGION_VALUE}"
          } >> "$GITHUB_ENV"
          echo "AWS credentials configured via OIDC."
      - name: Log in to Amazon ECR
        run: |
          ECR_REGISTRY="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "::add-mask::${ECR_REGISTRY}"
          aws ecr get-login-password --region "${AWS_REGION}" |
            docker login --username AWS --password-stdin "${ECR_REGISTRY}" >/dev/null
          echo "Logged in to Amazon ECR."

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REPOSITORY: edp-${{ env.ENV }}-analytics-agent
          IMAGE_TAG:      sha-${{ github.sha }}
        run: |
          ECR_REGISTRY="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "::add-mask::${ECR_REGISTRY}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          if ! docker build --target runtime \
            -t "${IMAGE_URI}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            . >/tmp/docker-build.log 2>&1; then
            echo "Docker build failed."
            exit 1
          fi
          docker push "${IMAGE_URI}" >/dev/null
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" >/dev/null
          echo "Container image pushed to ECR."
          echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        env:
          TASK_FAMILY: edp-${{ env.ENV }}-analytics-agent
        run: |
          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --query taskDefinition \
            > task-definition.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name:  ${{ env.CONTAINER_NAME }}
          image:           ${{ steps.build-image.outputs.image }}

      - name: Deploy new task definition to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:            ${{ steps.task-def.outputs.task-definition }}
          service:                    edp-${{ env.ENV }}-analytics-agent
          cluster:                    edp-${{ env.ENV }}-analytics-agent
          wait-for-service-stability: true

      - name: Deployment summary
        run: |
          echo ""
          echo "Deployed analytics agent to ECS:"
          echo "  Environment : ${{ env.ENV }}"
          echo "  Service     : analytics agent"
          echo ""
          echo "Endpoint details are available from Terraform outputs or the AWS console."
